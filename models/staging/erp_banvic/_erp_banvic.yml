sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    database: dev
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado.
        columns:
          - name: cod_localidade
            data_tests:
              - unique
              - not_null

      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente da Banvic.
        columns:
          - name: cod_cliente
            data_tests:
              - unique
              - not_null
          - name: cod_localidade
            data_tests:
              - relationships:
                  arguments:
                    to: source('erp', 'localidades')
                    field: cod_localidade

      - name: colaboradores
        description: Tabela fonte de colaboradores com informações pessoais de cada colaborador da Banvic.
        columns:
          - name: cod_colaborador
            data_tests:
              - unique
              - not_null
          - name: cod_localidade
            data_tests:
              - relationships:
                  arguments:
                    to: source('erp', 'localidades')
                    field: cod_localidade

      - name: agencias
        description: Tabela fonte de agências com nome, endereço, tipo e data de abertura.
        columns:
          - name: cod_agencia
            data_tests:
              - unique
              - not_null
          - name: cod_localidade
            data_tests:
              - relationships:
                  arguments:
                    to: source('erp', 'localidades')
                    field: cod_localidade

      - name: contas
        description: Tabela fonte de contas com número da conta, cliente titular, agência, colaborador responsável, tipo de conta, saldos e datas de abertura e de último lançamento.
        columns:
          - name: num_conta
            data_tests:
              - unique
              - not_null

      - name: transacoes
        description: Tabela fonte de transações com código, conta, data, tipo e valor de cada transação realizada.
        columns:
          - name: cod_transacao
            data_tests:
              - unique
              - not_null
          - name: num_conta
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('erp', 'contas')
                    field: num_conta