# Projeto dbt do desafio de certificação em Analytics Engineer (Indicium).
# Constrói o data warehouse de vendas da Adventure Works no Databricks.
name: 'adventure_works'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  adventure_works:
    # Catálogo do Databricks onde o dbt grava todos os modelos.
    +database: adventure_works_dw

    # Staging: limpeza e padronização das tabelas de origem, uma para uma.
    staging:
      +schema: staging
      +materialized: view

    # Intermediate: joins e regras de negócio que preparam os marts.
    intermediate:
      +schema: intermediate
      +materialized: view

    # Marts: dimensões e fatos consumidos pelo Power BI.
    marts:
      +schema: marts
      +materialized: table